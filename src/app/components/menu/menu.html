<mat-toolbar color="primary">
  <mat-icon class="logo">redeem</mat-icon>
  <span class="title">Les cadeaux</span>
  <span class="spacer"></span>
  <nav>
    @for (link of links(); track link.path) {
    <a mat-button [routerLink]="link.path" [attr.aria-label]="link.label" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <mat-icon>{{ link.icon }}</mat-icon>
      <span class="label">{{ link.label }}</span>
    </a>
    }
    @if (isAuthenticated()) {
    <button mat-button type="button" aria-label="Déconnexion" (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span class="label">Déconnexion</span>
    </button>
    }
  </nav>
</mat-toolbar>
